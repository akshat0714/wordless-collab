[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wordless-audit"
version = "0.1.0"
description = "Evidence-first communication assistance and replay audit for customer support"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "polars>=1.8,<2",
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "rank-bm25>=0.2.2,<0.3",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3.0,<6",
  "torch>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.110,<7",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]
research = [
  "bertopic>=0.16,<1",
  "hdbscan>=0.8.40,<1",
  "umap-learn>=0.5.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["wordless"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]

# Wordless only performs CPU inference. PyPI's Linux torch wheel includes the
# CUDA runtime, so pin torch to PyTorch's explicit CPU wheel index on every
# supported platform. Keeping the index explicit prevents unrelated packages
# from being resolved outside PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
